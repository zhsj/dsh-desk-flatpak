name: Flatpak

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  publish:
    permissions:
      contents: read
      packages: write
      pages: write
      id-token: write
    uses: aetherpak/actions/.github/workflows/publish.yml@v3
    with:
      manifest-path: com.deepseek.harness.yml
      arches: x86_64
      branch: ${{ github.event_name == 'push' && 'stable' || 'test' }}
      pages-url: https://zhsj.me/dsh-desk-flatpak
      run-linter: false
      oci-repository: ${{ github.repository }}
      remote-name: dsh
      image-deltas: true
      delta-back: 1
      upload-bundle: ${{ github.event_name != 'push' }}
      dry-run: ${{ github.event_name != 'push' }}
