name: Flatpak

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  subject:
    runs-on: ubuntu-latest
    outputs:
      value: ${{ steps.subject.outputs.value }}
    steps:
      - id: subject
        shell: bash
        env:
          SHA: ${{ github.sha }}
          MESSAGE: ${{ github.event.head_commit.message || github.event.pull_request.title || '' }}
        run: |
          set -euo pipefail
          title=$(printf '%s\n' "$MESSAGE" | head -n1 | tr -d '\r')
          if [ -n "$title" ]; then
            echo "value=${title} (${SHA:0:12})" >> "$GITHUB_OUTPUT"
          else
            echo "value=Build (${SHA:0:12})" >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: subject
    permissions:
      contents: read
      packages: write
      pages: write
      id-token: write
    uses: aetherpak/actions/.github/workflows/publish.yml@v3
    with:
      manifest-path: com.deepseek.harness.yml
      arches: x86_64
      branch: ${{ github.event_name == 'push' && 'stable' || 'test' }}
      pages-url: https://zhsj.me/dsh-desk-flatpak
      run-linter: false
      oci-repository: ${{ github.repository }}
      remote-name: dsh
      image-deltas: true
      delta-back: 3
      dry-run: ${{ github.event_name != 'push' }}
      builder-args: |
        --subject=${{ needs.subject.outputs.value }}
