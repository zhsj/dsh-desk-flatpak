app-id: com.deepseek.harness
runtime: org.freedesktop.Platform
runtime-version: "26.08"
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.node24
base: org.electronjs.Electron2.BaseApp
base-version: "26.08"
command: deepseek-harness
separate-locales: false

finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=pulseaudio
  - --device=dri
  - --env=GIT_EXEC_PATH=/app/libexec/git-core
  - --env=DSH_LANDLOCK_LAUNCHER=/app/bin/landlock-run
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.kde.StatusNotifierWatcher

modules:
  - name: libvips
    buildsystem: meson
    cleanup:
      - /bin/vips*
      - /include/vips/
      - /share/gir-1.0/
      - /share/man/
    sources:
      - type: git
        url: https://github.com/libvips/libvips.git
        tag: v8.18.7
        commit: 24ad4d042940e6bf99a68871ba886ca8847c9c82
      - type: file
        url: https://gist.githubusercontent.com/lovell/313a6901e9db1bf285f2a1f1180499e4/raw/3988223c7dfa4d22745d9392034b0117abef1446/libvips-cpp-soversion.patch
        sha256: 256b7d6f8c973bb53b20cff5171c7117d6b35d3aa4e72d22cb906f4fe1e2c890
      - type: shell
        commands:
        - patch -p1 < libvips-cpp-soversion.patch

  - name: dsh-desktop
    buildsystem: simple
    build-options:
      no-debuginfo: true
      build-args:
        - --share=network
      append-path: /usr/lib/sdk/node24/bin:/run/build/dsh-desktop/node_modules/.bin
      env:
        DSH_DESKTOP_TARGET_PLATFORM: linux
        DSH_DESKTOP_TARGET_ARCH: x64
        ELECTRON_BUILDER_CACHE: /run/build/dsh-desktop/.electron-builder-cache
        ELECTRON_CACHE: /run/build/dsh-desktop/.electron-cache
    build-commands:
      - |
        set -eux

        npm install pnpm@11.28.5

        cd deepseek-harness

        pnpm install --frozen-lockfile
        pnpm --filter @deepseek-ai/dsh-desktop run package:dir

        mkdir -p /app/main
        APPDIR=apps/desktop/.desktop-build/targets/linux-x64/unsigned-artifacts/linux-unpacked
        cp -a "${APPDIR}/." /app/main/
        ln -srf "$(find /app/main/ -name landlock-run -executable -print -quit)" /app/bin/
    sources:
      - type: git
        url: https://github.com/deepseek-ai/deepseek-harness.git
        tag: dsh-v0.2.1-alpha.2
        commit: d743267388641bc76f17c45ce8b4c231aed1d32c
        dest: deepseek-harness
      - type: patch
        paths:
          - linux-desktop.patch
        options:
          - -d
          - deepseek-harness
      - type: file
        path: env
        dest-filename: .env.linux
        dest: deepseek-harness/apps/desktop

  - name: desktop-integration
    buildsystem: simple
    build-commands:
      - |
        install -Dm755 "${FLATPAK_BUILDER_BUILDDIR}/deepseek-harness.sh" \
          /app/bin/deepseek-harness

        install -Dm644 "${FLATPAK_BUILDER_BUILDDIR}/com.deepseek.harness.desktop" \
          /app/share/applications/com.deepseek.harness.desktop

        for size in 512 256 128 64 48; do
          mkdir -p "/app/share/icons/hicolor/${size}x${size}/apps"
          ffmpeg -y -loglevel error -i /app/main/resources/icon.png \
            -vf "scale=${size}:${size}" \
            "/app/share/icons/hicolor/${size}x${size}/apps/com.deepseek.harness.png"
        done

        install -Dm644 "${FLATPAK_BUILDER_BUILDDIR}/com.deepseek.harness.metainfo.xml" \
          /app/share/metainfo/com.deepseek.harness.metainfo.xml
    sources:
      - type: file
        path: deepseek-harness.sh
      - type: file
        path: com.deepseek.harness.desktop
      - type: file
        path: com.deepseek.harness.metainfo.xml

  - name: git
    buildsystem: simple
    build-commands:
      - mkdir -p ${FLATPAK_DEST}/libexec
      - cp -a /usr/libexec/git-core ${FLATPAK_DEST}/libexec/git-core
      - ln -s ../libexec/git-core/git ${FLATPAK_DEST}/bin/git
